<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Uganda Film Sector Gaps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interactive guide to the Uganda Film Sector Gap & Needs Assessment: 38 gaps, scored and prioritised, mapped to the film value chain.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky slate header with view tabs; one 1200px column; detail drawer slides from the right (full screen on phones). */
:root{
  --navy:#0D2137; --gold:#B8861F; --gold-soft:#F3E7CC;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EAEFF5; --ink:#0D2137; --muted:#56667A; --line:#D3DBE5;
  --act:#B23A22; --act-bg:#F8E3DD; --plan:#9A6510; --plan-bg:#F6EBD6; --quick:#23725A; --quick-bg:#DDF0E8; --mon:#5D6B7C; --mon-bg:#E6EAF0;
  --strip:#0D2137; --strip-ink:#F4F6F9; --sprocket:#F4F6F9;
  --logo-filter:none; --shadow:0 10px 30px rgba(13,33,55,.12);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0D2137; --gold:#D9AE4A; --gold-soft:#3A3018;
  --bg:#08121F; --surface:#0F1D30; --surface-2:#16273E; --ink:#E5ECF4; --muted:#9AA9BC; --line:#24384F;
  --act:#F08A6E; --act-bg:#3A1C15; --plan:#E2B25A; --plan-bg:#33270F; --quick:#6FCBA6; --quick-bg:#123329; --mon:#A9B6C6; --mon-bg:#1D2A3B;
  --strip:#020912; --strip-ink:#E5ECF4; --sprocket:#16273E;
  --logo-filter:invert(1) brightness(1.1); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --navy:#0D2137; --gold:#D9AE4A; --gold-soft:#3A3018;
  --bg:#08121F; --surface:#0F1D30; --surface-2:#16273E; --ink:#E5ECF4; --muted:#9AA9BC; --line:#24384F;
  --act:#F08A6E; --act-bg:#3A1C15; --plan:#E2B25A; --plan-bg:#33270F; --quick:#6FCBA6; --quick-bg:#123329; --mon:#A9B6C6; --mon-bg:#1D2A3B;
  --strip:#020912; --strip-ink:#E5ECF4; --sprocket:#16273E;
  --logo-filter:invert(1) brightness(1.1); --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.08}
h2{font-size:clamp(1.6rem,3vw,2.1rem)}
h3{font-size:1.25rem}
p{margin:0}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.12rem;max-width:68ch}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-inner{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:34px;width:auto;filter:var(--logo-filter)}
.brand .t{font-family:var(--f-display);font-weight:700;font-size:1.25rem;line-height:1;white-space:nowrap}
.brand .s{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:1.02rem;letter-spacing:.03em;text-decoration:none;padding:8px 12px;border-radius:6px;color:var(--muted);white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--surface-2)}
nav.tabs a[aria-current="page"]{color:var(--ink);background:var(--gold-soft);box-shadow:inset 0 -2px 0 var(--gold)}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 9px;font:500 .78rem var(--f-mono);cursor:pointer}
.status{background:var(--navy);color:#F4F6F9}
.status .wrap{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding-block:7px;font-size:.84rem}
.status b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#E2B85A}

main{padding-block:28px 64px}
section.view{display:grid;gap:28px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:grid;gap:12px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:clamp(2.2rem,5.2vw,3.6rem);letter-spacing:.005em}
.hero h1 em{font-style:normal;color:var(--gold)}
.constraints{counter-reset:c;display:grid;gap:10px;margin-top:6px}
.constraints li{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.constraints li::before{counter-increment:c;content:counter(c);font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1;color:var(--gold);width:1.2em}
.constraints{padding:0;margin:0}
.constraints b{font-weight:700}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile .n{font-family:var(--f-display);font-weight:700;font-size:2.1rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:.9rem}
.tile .src{font-size:.75rem;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;white-space:nowrap}
.q-Act{background:var(--act-bg);color:var(--act)} .q-Plan{background:var(--plan-bg);color:var(--plan)}
.q-Quick{background:var(--quick-bg);color:var(--quick)} .q-Monitor{background:var(--mon-bg);color:var(--mon)}
.ev{border:1px solid currentColor;color:var(--ink);background:transparent}
.ev-FACT{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ev-FINDING{color:var(--ink)}
.ev-HYPOTHESIS{border-style:dashed;color:var(--plan)}
.ev-DATA{background:repeating-linear-gradient(135deg,transparent 0 4px,var(--surface-2) 4px 8px);color:var(--muted);border-color:var(--muted)}
.gid{font:600 .8rem var(--f-mono);color:var(--gold);letter-spacing:.04em}

/* film strip */
.strip{background:var(--strip);border-radius:8px;padding:14px 10px;position:relative;overflow-x:auto}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background-image:radial-gradient(circle at 9px 4px,var(--sprocket) 2.6px,transparent 3px);background-size:18px 8px;opacity:.55}
.strip::before{top:3px}.strip::after{bottom:3px}
.frames{display:grid;grid-template-columns:repeat(9,minmax(96px,1fr));gap:6px;min-width:900px}
.frame{all:unset;cursor:pointer;border-radius:4px;padding:10px 8px 9px;display:grid;gap:6px;color:var(--strip-ink);border:1px solid rgba(255,255,255,.12);text-align:left}
.frame:hover,.frame:focus-visible{border-color:var(--gold)}
.frame .k{font:500 .62rem var(--f-mono);letter-spacing:.1em;opacity:.7}
.frame .nm{font-family:var(--f-display);font-weight:600;font-size:1rem;line-height:1.05}
.frame .ct{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.frame .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.frame .bar i{display:block;height:100%;background:var(--gold)}
.layers{display:grid;gap:6px}
.layer{all:unset;cursor:pointer;display:grid;grid-template-columns:2.2em minmax(0,1fr) 3.4em;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.layer:hover,.layer:focus-visible{border-color:var(--gold)}
.layer .num{font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--gold)}
.layer .nm{font-weight:600;font-size:.95rem;min-width:0}
.layer .meter{grid-column:2/3;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.layer .meter i{display:block;height:100%;background:var(--navy)}
:root[data-theme="dark"] .layer .meter i{background:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .layer .meter i{background:var(--gold)}}
.layer .ct{font:600 .95rem var(--f-mono);text-align:right;grid-row:1/3;grid-column:3}

/* loop diagram */
.loop svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}
.loop text{fill:var(--ink);font-family:var(--f-body)}
.verdict{border-left:3px solid var(--gold);padding:4px 0 4px 14px}

/* explorer */
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:860px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.filters{grid-template-columns:1fr}}
.filters label{display:grid;gap:4px;font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.filters select,.filters input{font:400 .95rem var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
.filters .wide{grid-column:span 2}
@media (max-width:480px){.filters .wide{grid-column:auto}}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{font:600 .85rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.activechips{display:flex;gap:6px;flex-wrap:wrap}
.activechips button{font:500 .75rem var(--f-mono);background:var(--gold-soft);color:var(--ink);border:0;border-radius:4px;padding:4px 8px;cursor:pointer}
.list{display:grid;gap:8px}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:3.6em minmax(0,1fr) 150px 100px;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.row:hover,.row:focus-visible{border-color:var(--gold);box-shadow:var(--shadow)}
.row .ttl{font-weight:600;line-height:1.3}
.row .meta{font-size:.82rem;color:var(--muted);margin-top:3px}
.scores{display:grid;gap:5px}
.sbar{display:grid;grid-template-columns:2.4em 1fr 2.6em;gap:6px;align-items:center;font:500 .68rem var(--f-mono);color:var(--muted)}
.sbar .track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.sbar .track i{display:block;height:100%}
.sbar.sev i{background:var(--act)} .sbar.tr i{background:var(--quick)}
.sbar span:last-child{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:700px){.row{grid-template-columns:3.2em minmax(0,1fr)}.row .scores,.row .qcell{grid-column:2}}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* matrix */
.matrix svg{width:100%;height:auto;display:block}
.matrix .axis{font:500 11px var(--f-mono);fill:var(--muted)}
.matrix .qlab{font:700 15px var(--f-display);letter-spacing:.06em}
.dot{cursor:pointer}
.dot circle{stroke:var(--surface);stroke-width:1.5}
.dot text{font:600 10px var(--f-mono);fill:var(--ink);pointer-events:none}
.dot:hover circle,.dot:focus circle{stroke:var(--gold);stroke-width:3}
.dot:focus{outline:none}
.qlists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.qlists{grid-template-columns:1fr}}
.qlist h3{display:flex;gap:10px;align-items:center}
.linkrow{all:unset;cursor:pointer;display:grid;grid-template-columns:3.4em minmax(0,1fr) auto;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);font-size:.92rem}
.linkrow:hover,.linkrow:focus-visible{background:var(--surface-2)}
.linkrow .pr{font:500 .75rem var(--f-mono);color:var(--muted)}

/* top 10 */
.topgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:800px){.topgrid{grid-template-columns:1fr}}
.topcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;grid-template-columns:3.2rem minmax(0,1fr);align-items:start}
.topcard .rk{font-family:var(--f-display);font-weight:700;font-size:2.6rem;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}
.topcard h3{font-size:1.2rem}
.kvs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.kvs b{color:var(--ink);font-weight:600}
.textlink{all:unset;cursor:pointer;font:600 .85rem var(--f-body);color:var(--ink);border-bottom:1px solid var(--gold);justify-self:start}

/* roadmap */
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.phases{grid-template-columns:1fr}}
.phase{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.phase .when{font:500 .72rem var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.phase .why{font-size:.85rem;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{all:unset;cursor:pointer;font:600 .74rem var(--f-mono);padding:5px 8px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2)}
.pill:hover,.pill:focus-visible{border-color:var(--gold)}
.pill.dep{font-style:italic;opacity:.9}
.depx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:800px){.depx{grid-template-columns:1fr}}
.depx .centre{background:var(--gold-soft);border-radius:8px;padding:14px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tablewrap table{min-width:640px}
.sources li{margin-bottom:6px;font-size:.9rem;overflow-wrap:anywhere}
.callout{background:var(--gold-soft);border-radius:8px;padding:14px 16px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,22,.45);z-index:40}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dhead .x{justify-self:end;margin-top:-6px}
.dbody{overflow-y:auto;padding:18px 20px 40px;display:grid;gap:16px;align-content:start}
.dbody dl{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:10px 14px;margin:0}
.dbody dt{font:600 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.dbody dd{margin:0;font-size:.95rem}
@media (max-width:520px){.dbody dl{grid-template-columns:1fr}.dbody dt{padding-top:6px}}
.scoregrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scoregrid div{background:var(--surface-2);border-radius:6px;padding:8px;font-size:.78rem;color:var(--muted)}
.scoregrid b{display:block;font:700 1.3rem var(--f-display);color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:22px 40px;font-size:.85rem;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){aside.drawer{animation:slide .22s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<script type="application/json" id="data">{"gaps": [{"id": "G01", "d": 1, "title": "No adopted National Film Policy", "current": "No National Film Policy is in force. PGU Strategic Plan 2025 records its absence. Lead ministry is unsettled: the Strategic Plan names MoICT&NG as lead on film policy; the 2020 EU/UNESCO film-sector project was run with MGLSD.", "cur_label": "FACT", "target": "Cabinet-approved National Film Policy with a named lead ministry (NFIDP Pillar 1).", "size": "Binary: 0 of 1 policy instruments in place. Lead ministry not designated.", "causes": "No single ministerial home for film; film sits across culture (MGLSD), communications (MoICT&NG, UCC) and tourism (MTWA). No costed evidence base to take to Cabinet.", "layer": "All six layers", "players": "All 54 categories", "stage": "All nine stages", "affected": "All producers and regulators. Women, youth and regional producers lose most from ad hoc, Kampala-centred support.", "consequence": "Fund, commission, incentive and permit reform have no legal anchor. Development partners cannot align. Every other structural gap stalls.", "need": "Cabinet-level designation of a lead ministry, then a time-bound policy drafting process with industry seats. Policy must cover institution, finance, incentive, rights, labour and data.", "lead": "MGLSD or MoICT&NG (to be designated by Cabinet)", "lead_type": "Ministry", "partners": "NPA, MoFPED, MTWA, UCC, URSB, PGU (advocacy and drafting input), development partners", "cost_method": "Drafting, consultation and validation, benchmarked on D3 data-plan line costs: under UGX 500m.", "deps": ["G32"], "s": [5, 5, 5], "t_owner": 2, "p1": "1", "p2": "None", "region": "National", "label": "FACT", "sev": 5.0, "tr": 3.33, "prio": 16.65, "quad": "Plan", "layers": [1, 2, 3, 4, 5, 6], "stages": [0, 1, 2, 3, 4, 5, 6, 7, 8], "domain": "Policy, institutions & coordination", "p1n": "1 Policy & institution", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": ["G02", "G05", "G07", "G10", "G38"]}, {"id": "G02", "d": 1, "title": "No film commission or national film development institution", "current": "No film commission exists. UCC both regulates and develops (runs the Uganda Film Festival and the Content Development Support Programme). Benchmarks have dedicated bodies: Kenya Film Commission (Legal Notice 147 of 2015), Rwanda Film Office at RDB (2019), Morocco CCM.", "cur_label": "FACT", "target": "Uganda Film Commission or equivalent with a development, investment-attraction and permit-facilitation mandate (NFIDP Pillar 1).", "size": "0 institutions. Development, promotion and facilitation functions spread across at least four agencies.", "causes": "No policy anchor (G01). Regulator holds development functions by default. No funded establishment.", "layer": "All layers; strongest at 3 and 4", "players": "Production cos., locations and fixers, distributors, government and regulators", "stage": "Investment to exhibition", "affected": "Producers seeking finance and markets; foreign productions; regional associations.", "consequence": "No counterparty for foreign productions or co-production partners. Incentive and Fund have no administrator. Uganda competes without a front door.", "need": "Establish a commission by statute or statutory instrument after the policy, separating development from content regulation. Start as a unit inside an existing agency if a new body is not affordable.", "lead": "Lead ministry (G01)", "lead_type": "Ministry", "partners": "MoFPED, Ministry of Public Service, UCC, UIA, UTB, PGU", "cost_method": "Recurrent establishment of a small agency or unit, 15 to 30 staff: about UGX 2bn to 5bn a year.", "deps": ["G01"], "s": [5, 4, 5], "t_owner": 2, "p1": "1", "p2": "7", "region": "National", "label": "FACT", "sev": 4.67, "tr": 2.0, "prio": 9.34, "quad": "Plan", "layers": [1, 2, 3, 4, 5, 6], "stages": [0, 1, 2, 3, 4, 5, 6], "domain": "Policy, institutions & coordination", "p1n": "1 Policy & institution", "p2n": "7 Investment, partnerships & exports", "costn": "Medium", "timen": "Structural", "dependents": ["G04", "G05", "G23", "G37"]}, {"id": "G03", "d": 1, "title": "No 'who regulates what' map; overlapping mandates", "current": "D2 identifies at least 11 regulatory touchpoints for one production (DCIC, URSB, Police, URA, local governments, UCC, MoICT&NG, Media Council, MTWA/UTB, MGLSD). Strategic Plan 2025 notes mandate duplication between UCC, Media Council, MGLSD and URSB. No consolidated map exists.", "cur_label": "FACT", "target": "Published regulatory map: every permit, fee, form, legal basis and service time per production type.", "size": "Number of permits, fees and approval times per production: DATA GAP.", "causes": "Mandates created by separate laws (Communications Act 2013, Press and Journalist Act, Copyright Act) without coordination.", "layer": "Layers 2 to 4", "players": "Producers, fixers, government and regulators", "stage": "Production, distribution, exhibition", "affected": "Small producers bear fixed compliance costs disproportionately. Regional producers travel to Kampala for approvals.", "consequence": "Compliance cost and time unknown, so reform cannot be targeted. Informality persists because formal routes are opaque.", "need": "Regulatory mapping study with a mystery-shopper test of three production types (local feature, documentary, foreign service production). Publish results.", "lead": "PGU Secretariat (study) with MoICT&NG", "lead_type": "PGU Secretariat", "partners": "UCC, Media Council, URSB, DCIC, URA, MoLG, UIA", "cost_method": "Desk study plus 30 to 40 interviews: under UGX 60m.", "deps": [], "s": [4, 3, 4], "t_owner": 4, "p1": "1", "p2": "None", "region": "National", "label": "FACT", "sev": 3.67, "tr": 4.67, "prio": 17.14, "quad": "Act now", "layers": [2, 3, 4], "stages": [2, 5, 6], "domain": "Policy, institutions & coordination", "p1n": "1 Policy & institution", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": ["G04"]}, {"id": "G04", "d": 1, "title": "Permit burden; no single permit window", "current": "UCC Film, Documentaries and Commercial Still Photography Regulations 2019 require licences to produce and to exhibit, with separate licensing per platform (secondary source). Published time-to-permit: none found. PGU report to NPA (2026) recommends a one-stop shop for foreign productions.", "cur_label": "FINDING", "target": "Single film permit window with a published service standard and fee schedule (NFIDP Pillar 1 and 7).", "size": "Time-to-permit and total fees per production: DATA GAP until G03 is done.", "causes": "Multiple agencies, no lead coordinator, paper processes, no service standards.", "layer": "Layers 2 and 3", "players": "Production cos., locations and fixers, foreign productions", "stage": "Production", "affected": "Foreign service productions and local producers shooting on public assets, parks and city locations.", "consequence": "Lost foreign spend (D3 accelerated scenario assumes 2 productions a year at US$2m local spend; depends on this). Tanzania 2019 rules show how burden deters producers.", "need": "Single window, online, with agency sign-offs behind it. Standard filming agreements for public assets. Locations database.", "lead": "UCC with lead ministry; later the commission", "lead_type": "Agency", "partners": "DCIC, UWA, MTWA/UTB, KCCA and local governments, Uganda Police, URA", "cost_method": "Digital window build and process re-engineering: UGX 0.5bn to 2bn.", "deps": ["G03", "G02"], "s": [3, 4, 3], "t_owner": 3, "p1": "1", "p2": "7", "region": "National", "label": "FINDING", "sev": 3.33, "tr": 3.0, "prio": 9.99, "quad": "Monitor", "layers": [2, 3], "stages": [2], "domain": "Policy, institutions & coordination", "p1n": "1 Policy & institution", "p2n": "7 Investment, partnerships & exports", "costn": "Medium", "timen": "Medium", "dependents": ["G05", "G37"]}, {"id": "G05", "d": 1, "title": "No production incentive", "current": "Uganda offers no film production incentive (Strategic Plan 2025; PGU report to NPA 2026). South Africa pays 25% of qualifying spend (plus 5% for qualifying local service companies) but approved no new projects in 2024/25 and 2025/26 owing to funding shortfall. Kenya legislators gave initial approval to a 30% incentive in 2015; current operation not verified. Morocco recorded MAD 1.21bn foreign production spend in 2025.", "cur_label": "FACT", "target": "A capped, qualifying-spend incentive appraised by MoFPED, with skills-transfer conditions.", "size": "0 incentives. Foreign production local spend about UGX 2bn a year (D3 ESTIMATE).", "causes": "No policy or administering body; MoFPED has no appraisal evidence; fiscal caution after other sector incentives.", "layer": "Layers 2 and 3", "players": "Production cos., crew, equipment rental, locations, hotels and transport", "stage": "Investment, production", "affected": "Crew and youth seeking skilled work; tourism suppliers in regions where shoots take place.", "consequence": "Uganda stories shot elsewhere. Skills transfer and location exposure lost. South Africa shows an unfunded incentive damages credibility faster than having none.", "need": "Cost-benefit appraisal using D3 figures; design a capped rebate paid only from a ring-fenced annual allocation, with audit and local-hire conditions. Do not announce before funding is secured.", "lead": "MoFPED", "lead_type": "Ministry", "partners": "Lead ministry, URA, commission (G02), UIA, MTWA, PGU (evidence)", "cost_method": "Rebate outlay scales with spend: 25% to 30% of qualifying spend; UGX 2bn to 8bn a year at 2 to 4 productions.", "deps": ["G01", "G02", "G04", "G32"], "s": [3, 4, 2], "t_owner": 2, "p1": "7", "p2": "None", "region": "National", "label": "FACT", "sev": 3.0, "tr": 1.33, "prio": 3.99, "quad": "Monitor", "layers": [2, 3], "stages": [0, 2], "domain": "Policy, institutions & coordination", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "High", "timen": "Structural", "dependents": []}, {"id": "G06", "d": 1, "title": "Import duty and VAT on professional equipment", "current": "Professional film equipment attracts import duty (10% band), 1.5% infrastructure levy, 1% import declaration fee and 18% VAT (D3, from PwC Tax Data Card 2025/26 and NPA 2025). Equipment imports estimated at UGX 6bn a year (D3 ESTIMATE).", "cur_label": "FACT", "target": "Duty remission or zero-rating for registered production and rental companies on defined HS codes.", "size": "Up to about 30% added to landed equipment cost (DERIVED from listed rates).", "causes": "Film equipment not treated as capital goods for a priority sector. Remission under the EAC Common External Tariff needs EAC process.", "layer": "Layer 3", "players": "Equipment rental, production cos., post-production", "stage": "Production, post-production", "affected": "Regional rental businesses and new entrants; drives kit hire from abroad.", "consequence": "High capital cost keeps rental market thin and shoots under-equipped; high-end kit hired from Nairobi or Johannesburg.", "need": "Request duty remission scheme for listed equipment for certified companies (Producers Mark as qualifying test). VAT deferment on capital imports.", "lead": "MoFPED", "lead_type": "Ministry", "partners": "URA, EAC Secretariat, PGU (HS-code list and certification)", "cost_method": "Revenue forgone, not spend: duty on UGX 6bn imports is under UGX 1bn a year (DERIVED).", "deps": ["G09"], "s": [2, 3, 2], "t_owner": 3, "p1": "5", "p2": "None", "region": "National", "label": "FACT", "sev": 2.33, "tr": 3.67, "prio": 8.55, "quad": "Quick win", "layers": [3], "stages": [2, 3], "domain": "Policy, institutions & coordination", "p1n": "5 Regional infrastructure", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": ["G16"]}, {"id": "G07", "d": 2, "title": "No operational National Film Fund", "current": "NFIDP proposes UGX 33.15bn for a National Film Fund (PROPOSAL; PGU Impact Report 2025-2026). Film finance deployed: zero (D3 KPI 13). UCC's Content Development Support Programme previously awarded UGX 1.2bn to 14 projects (NPA 2025 citing UCC 2023). Ghana announced a US$25m film package in 2021.", "cur_label": "FACT", "target": "Fund operational with independent governance, published criteria and windows for development, production, P&A and regional projects (NFIDP Pillar 4).", "size": "UGX 33.15bn over 2027 to 2029 proposed against UGX 0 deployed.", "causes": "No policy or legal vehicle; no fund manager; no data to appraise returns; NFIDP total conflict (UGX 61bn vs UGX 68.89bn) unresolved.", "layer": "Layers 1 to 4", "players": "Producers, writers, directors, production cos.", "stage": "Investment, development, production, marketing", "affected": "Independent producers outside commissioned work; women and regional producers if quotas are set.", "consequence": "Feature production stays at micro budgets (65% under UGX 20m, D3 ESTIMATE). Quality ceiling blocks platform and export sales.", "need": "Fund legal vehicle, independent manager (UDB or a competitively appointed manager), investment committee with industry seats but no conflicted members, published windows and reporting. Industry role: design input and an advisory seat.", "lead": "MGLSD and MoFPED", "lead_type": "Ministry", "partners": "UDB, NPA, development partners, PGU (design input, advisory seat)", "cost_method": "UGX 33.15bn capital proposed (NFIDP) plus 5% to 8% management cost.", "deps": ["G01", "G32", "G25"], "s": [5, 5, 4], "t_owner": 2, "p1": "4", "p2": "None", "region": "National", "label": "FACT", "sev": 4.67, "tr": 2.0, "prio": 9.34, "quad": "Plan", "layers": [1, 2, 3, 4], "stages": [0, 1, 2, 4], "domain": "Finance & investment", "p1n": "4 Film Fund", "p2n": "None", "costn": "High", "timen": "Medium", "dependents": ["G14", "G24", "G38"]}, {"id": "G08", "d": 2, "title": "No bank or IP-backed lending for film", "current": "PGU engaged UDB in September 2025 on facilities based on IP, contracts, production cash flows and equipment; no product exists (PGU Impact Report). Nigeria's CBN Creative Industry Financing Initiative (N22.9bn seed, 2019) reportedly reached very few borrowers because of collateral demands (ThisDay 2025).", "cur_label": "FACT", "target": "Pilot facility lending against licence receivables and registered IP, with a partial guarantee.", "size": "Number of film loans by Ugandan banks: DATA GAP. Believed near zero.", "causes": "Symptom: no film lending. Causes: no verifiable revenue history; weak chain of title (G25); no IP valuation method; no collateral practice for IP; lender unfamiliarity; informality (G09).", "layer": "Layer 6 into Layers 1 to 2", "players": "Banks, funds and investors; insurers and guarantors; producers", "stage": "Investment", "affected": "Established producers with catalogues first; others later.", "consequence": "Capital only from savings and grants. Catalogue value never converts to collateral.", "need": "UDB pilot: lend against signed licence contracts (receivables), registered titles and equipment; partial credit guarantee; standard due-diligence pack. Legal check on registering IP security interests under the Security Interest in Movable Property Act 2019 (LEGAL CONSIDERATION: requires legal opinion).", "lead": "UDB", "lead_type": "Agency", "partners": "Bank of Uganda, commercial banks, URSB (registration), insurers, PGU (pipeline and standards)", "cost_method": "Pilot pool of UGX 2bn to 5bn plus guarantee cover; technical assistance under UGX 300m.", "deps": ["G25", "G28", "G09"], "s": [5, 4, 4], "t_owner": 3, "p1": "4", "p2": "None", "region": "National", "label": "FACT", "sev": 4.33, "tr": 3.0, "prio": 12.99, "quad": "Plan", "layers": [1, 2, 6], "stages": [0], "domain": "Finance & investment", "p1n": "4 Film Fund", "p2n": "None", "costn": "Medium", "timen": "Medium", "dependents": ["G15", "G16"]}, {"id": "G09", "d": 2, "title": "Low investor readiness: informality and weak records", "current": "About 22% of film enterprises estimated formal (D3 ESTIMATE). UBOS records 87.6% of non-agricultural employment as informal (Labour Market Survey 2025). 1,769 production MSMEs registered in 2020; 15% to 35% assumed active (D3).", "cur_label": "FACT", "target": "Certified producers with registered companies, basic accounts and budget-to-actual records.", "size": "About 78% of enterprises informal (D3 ESTIMATE).", "causes": "Small scale; few benefits from formality; low business training; most below the UGX 150m VAT threshold.", "layer": "Layers 1 to 3", "players": "Producers, production cos.", "stage": "Investment", "affected": "Youth-led micro companies; women-led companies (share unknown).", "consequence": "Firms cannot pass due diligence. Tax base thin (tax gap UGX 8.5bn a year, D3 ESTIMATE).", "need": "Producers Mark tiers tied to records; standard accounting and budget templates; film finance and investment readiness training (November 2026 workshop as first cohort).", "lead": "PGU Secretariat", "lead_type": "PGU Secretariat", "partners": "MGLSD (workshop funder), URSB, URA, SACCOs, UDB", "cost_method": "Templates and training cohorts: UGX 100m to 300m a year.", "deps": [], "s": [4, 3, 4], "t_owner": 4, "p1": "2", "p2": "4", "region": "All regions", "label": "FACT", "sev": 3.67, "tr": 4.67, "prio": 17.14, "quad": "Act now", "layers": [1, 2, 3], "stages": [0], "domain": "Finance & investment", "p1n": "2 Capacity building", "p2n": "4 Film Fund", "costn": "Low", "timen": "Quick win", "dependents": ["G06", "G08"]}, {"id": "G10", "d": 2, "title": "Thin pre-sales, commissioning and co-production finance", "current": "Free-to-air TV often runs a barter model: producers buy airtime and share advertising (Strategic Plan 2025; HYPOTHESIS strength). Circuits announced up to US$15m for Ugandan collaborations (AllAfrica, Aug 2025). No co-production treaty identified in this study (DATA GAP: confirm with MoFA).", "cur_label": "HYPOTHESIS", "target": "Broadcasters and platforms commission or license at a fee; at least two co-production treaties in force (NFIDP Pillar 7).", "size": "Licence-fee income from TV and OTT: DATA GAP (D3).", "causes": "Broadcaster economics; no local content fee floor; no treaty framework; producers lack sales skills.", "layer": "Layers 4 and 6", "players": "FTA TV, pay-TV, OTT, sales agents, producers", "stage": "Investment, distribution", "affected": "Series and drama producers; regional-language producers.", "consequence": "Producers fund distribution instead of being paid for it. Value flows the wrong way.", "need": "Commissioning code with minimum licence terms; co-production treaty programme starting with EAC partners; market access support.", "lead": "UCC (commissioning code); MoFA and lead ministry (treaties)", "lead_type": "Agency", "partners": "Broadcasters, platforms, PGU, Kenya and Rwanda counterparts", "cost_method": "Policy and negotiation work: under UGX 300m.", "deps": ["G01", "G20"], "s": [4, 4, 3], "t_owner": 3, "p1": "7", "p2": "None", "region": "National", "label": "HYPOTHESIS", "sev": 3.67, "tr": 3.67, "prio": 13.47, "quad": "Act now", "layers": [4, 6], "stages": [0, 5], "domain": "Finance & investment", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": []}, {"id": "G11", "d": 3, "title": "Training capacity unmapped against the 2027 target", "current": "2027 target: 1,400 filmmakers trained, 200 per region, seven regions (PROPOSAL). Trained under the programme: 0 (D3 KPI 14). Output of film schools, universities and TVET: DATA GAP. Known providers include Kampala Film School, Makerere University and Uganda Christian University (curriculum engagement with PGU). A claim that UCC trained 10,000+ filmmakers (Nile Post 2025) is UNVERIFIED.", "cur_label": "DATA GAP", "target": "1,400 trained in 2027 with accredited partners in each region.", "size": "Gap of 1,400 trainee places against unknown regional supply.", "causes": "No register of providers, curricula or graduates; delivery capacity outside Kampala unknown.", "layer": "Layer 6 into Layers 1 to 3", "players": "Film schools and TVETs, guilds, producers", "stage": "Development, production", "affected": "Youth (17.9% unemployment ages 15-24, UBOS LMS 2025); women; regions without providers.", "consequence": "Target missed or delivered by trainers without capacity. Funder confidence lost in year one.", "need": "Training capacity audit by region; partner accreditation; mobile teams where no provider exists; curriculum aligned to D5 shortages.", "lead": "PGU Secretariat with MGLSD", "lead_type": "PGU Secretariat", "partners": "MoES, UBTEB, universities, regional associations, UCC", "cost_method": "Audit and partner agreements: under UGX 100m. Programme delivery cost is in the NFIDP.", "deps": [], "s": [4, 3, 3], "t_owner": 4, "p1": "2", "p2": "6", "region": "All regions", "label": "DATA GAP", "sev": 3.33, "tr": 4.67, "prio": 15.55, "quad": "Quick win", "layers": [1, 2, 3, 6], "stages": [1, 2], "domain": "Skills", "p1n": "2 Capacity building", "p2n": "6 Youth employment", "costn": "Low", "timen": "Quick win", "dependents": ["G12", "G14"]}, {"id": "G12", "d": 3, "title": "Shortage of film business skills", "current": "Regional consultations report technical skills gaps (PGU Impact Report). Practitioner view: shortages are deepest in producing, film finance, sales, co-production, copyright, film accounting, OTT management and digital marketing.", "cur_label": "HYPOTHESIS", "target": "Each region has producers able to budget, raise finance, license and report.", "size": "Number of qualified line producers, film accountants and sales agents: DATA GAP.", "causes": "Training emphasises craft over business; few practitioners have closed licensing deals to teach from.", "layer": "Layers 1, 4, 5 and 6", "players": "Producers, line producers, distributors, sales agents, lawyers", "stage": "Investment, distribution, monetisation, royalties", "affected": "Producers with finished films and no sales route.", "consequence": "Finance and distribution interventions fail for lack of counterparties able to use them.", "need": "Business of film curriculum; mentoring by producers with closed deals; deal-clinic service in the commission or PGU.", "lead": "PGU Secretariat", "lead_type": "PGU Secretariat", "partners": "MGLSD, development partners, universities, UDB", "cost_method": "Modules within the 2027 programme: UGX 200m to 400m.", "deps": ["G11"], "s": [4, 4, 3], "t_owner": 4, "p1": "2", "p2": "None", "region": "All regions", "label": "HYPOTHESIS", "sev": 3.67, "tr": 4.67, "prio": 17.14, "quad": "Act now", "layers": [1, 4, 5, 6], "stages": [0, 5, 7, 8], "domain": "Skills", "p1n": "2 Capacity building", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": []}, {"id": "G13", "d": 3, "title": "Shortage of post-production and specialist technical skills", "current": "D2 hypothesis: high-end finishing done outside Uganda. D3 puts post-production done abroad at about UGX 0.32bn a year (ESTIMATE). At least 10 animation companies registered with URSB (Strategic Plan). Skills levels in sound, colour, VFX and animation: DATA GAP.", "cur_label": "HYPOTHESIS", "target": "Domestic capacity for sound mix, colour grade and VFX to platform delivery specification.", "size": "Share of features finished to international delivery spec: DATA GAP.", "causes": "Costly software and hardware; few senior trainers; no shared facility.", "layer": "Layer 3", "players": "Editing and colour, sound design, VFX and animation, film score", "stage": "Post-production", "affected": "Youth entering technical roles; animators.", "consequence": "Films rejected by platforms on technical grounds; spend leaves Uganda.", "need": "Post-production residencies linked to a shared facility (G15); vendor-certified training.", "lead": "PGU Secretariat with training partners", "lead_type": "PGU Secretariat", "partners": "Universities, technology firms, development partners", "cost_method": "Shared facility and trainers: UGX 0.5bn to 1.5bn.", "deps": ["G15"], "s": [3, 3, 2], "t_owner": 3, "p1": "2", "p2": "5", "region": "Kampala Metropolitan first", "label": "HYPOTHESIS", "sev": 2.67, "tr": 3.0, "prio": 8.01, "quad": "Monitor", "layers": [3], "stages": [3], "domain": "Skills", "p1n": "2 Capacity building", "p2n": "5 Regional infrastructure", "costn": "Medium", "timen": "Medium", "dependents": []}, {"id": "G14", "d": 3, "title": "No link from training to paid work", "current": "No tracer data on trainees. D3 scenario assumes 50% of trainees in paid film work from 2028 (ASSUMPTION). PGU report to NPA recommends a skills-transfer obligation on qualifying foreign productions.", "cur_label": "DATA GAP", "target": "Tracked employment outcomes; placements on productions as a condition of public support.", "size": "Employment rate of trainees: DATA GAP.", "causes": "Training funded as activity, not outcome; no placement mechanism.", "layer": "Layers 2 and 3", "players": "Crew categories, production cos.", "stage": "Production", "affected": "Youth and women trainees.", "consequence": "Trained people leave the sector; NFIDP employment claims cannot be verified.", "need": "Tracer study; placement quotas attached to Fund awards, incentive claims and hub use.", "lead": "PGU Secretariat with MGLSD", "lead_type": "PGU Secretariat", "partners": "Fund manager, commission, producers", "cost_method": "Tracer survey: UGX 30m to 60m a year.", "deps": ["G11", "G07"], "s": [3, 3, 2], "t_owner": 4, "p1": "6", "p2": "2", "region": "All regions", "label": "DATA GAP", "sev": 2.67, "tr": 4.67, "prio": 12.47, "quad": "Quick win", "layers": [2, 3], "stages": [2], "domain": "Skills", "p1n": "6 Youth employment", "p2n": "2 Capacity building", "costn": "Low", "timen": "Quick win", "dependents": []}, {"id": "G15", "d": 4, "title": "No purpose-built studio, sound stage or shared post facility", "current": "Inventory of studios, stages and post suites: DATA GAP. A Kampala/Mulago Film City is at project-preparation stage with a private partner who has agreed to make land available; a joint project document is being prepared for UDB financing (PGU Impact Report 2025-2026). Phase I hubs proposed: Kampala/Mulago, Mbarara, Gulu (PROPOSAL). UCC regional hub approval in principle starting with Gulu is reported, not confirmed.", "cur_label": "FACT", "target": "Three Phase I hubs operating with business plans (NFIDP Pillar 5).", "size": "0 of 3 hubs operating.", "causes": "No project finance structure proven; land and partner arrangements at early stage; demand data missing.", "layer": "Layers 2 and 3", "players": "Production cos. and studios, equipment rental, post-production", "stage": "Production, post-production", "affected": "All producers; regional producers outside hub cities.", "consequence": "Productions improvise sets; post stays fragmented; foreign productions see no base.", "need": "Bankable business cases for each hub with demand evidence; SPV governance that protects public and industry interests; an operator model agreed before construction.", "lead": "PGU Secretariat (Mulago JV); MGLSD (hub programme)", "lead_type": "PGU Secretariat", "partners": "Private land partner, UDB, UCC, local governments, project finance specialist", "cost_method": "Capital projects; cost per hub DATA GAP until feasibility. Order of magnitude above UGX 5bn for Mulago.", "deps": ["G32", "G08"], "s": [4, 4, 3], "t_owner": 3, "p1": "5", "p2": "None", "region": "Kampala Metropolitan, Western, Northern", "label": "FACT", "sev": 3.67, "tr": 1.67, "prio": 6.13, "quad": "Plan", "layers": [2, 3], "stages": [2, 3], "domain": "Infrastructure & equipment", "p1n": "5 Regional infrastructure", "p2n": "None", "costn": "High", "timen": "Structural", "dependents": ["G13"]}, {"id": "G16", "d": 4, "title": "Thin equipment rental market", "current": "D2 hypothesis: high-end kit hired from abroad. Equipment rental employment about 180 (D3 ESTIMATE). Strategic Plan targets one national equipment library and three regional extensions (no budget stated).", "cur_label": "HYPOTHESIS", "target": "National equipment library with regional extensions; affordable rates for certified members.", "size": "Equipment stock and rates: DATA GAP.", "causes": "Import cost (G06); small market; no finance for capital goods.", "layer": "Layer 3", "players": "Equipment rental, production cos.", "stage": "Production", "affected": "Regional and emerging producers.", "consequence": "Quality ceiling; foreign productions import kit.", "need": "Equipment library under PPP with an operator; asset finance product for rental firms (G08).", "lead": "PGU Secretariat with private operators", "lead_type": "Private sector", "partners": "UDB, rental companies, development partners", "cost_method": "Starter equipment pool: UGX 1bn to 3bn.", "deps": ["G06", "G08"], "s": [3, 3, 2], "t_owner": 3, "p1": "5", "p2": "None", "region": "All regions", "label": "HYPOTHESIS", "sev": 2.67, "tr": 3.0, "prio": 8.01, "quad": "Monitor", "layers": [3], "stages": [2], "domain": "Infrastructure & equipment", "p1n": "5 Regional infrastructure", "p2n": "None", "costn": "Medium", "timen": "Medium", "dependents": []}, {"id": "G17", "d": 4, "title": "Very few cinema screens; none outside a few towns", "current": "Functional cinemas: 10 (Media Council via NPA 2025). The Conversation (2025) counts 3 Kampala cinemas with 10 screens. CONFLICT unresolved. Ugandan titles screened in 2024 at Century Cinema sites in Kampala, plus venues in Mbarara and Entebbe (Daily Monitor 2024). Population 45.9m (UBOS census 2024).", "cur_label": "FACT", "target": "Formal or community screens in each region.", "size": "About 0.2 to 0.7 screens per million people (DERIVED: 10 to 30 screens over 45.9m).", "causes": "Mall-based cinema economics; high capital cost; competition from video halls and mobile.", "layer": "Layer 4", "players": "Cinemas, video halls, festivals", "stage": "Exhibition", "affected": "Audiences and producers outside Kampala; first window for local features.", "consequence": "Theatrical revenue for local films negligible; no regional premiere circuit.", "need": "Do not chase multiplexes. Upgrade licensed video halls and community venues to a basic projection standard; regional screening circuits linked to festivals.", "lead": "Local governments with Media Council and UCC", "lead_type": "Local government", "partners": "Exhibitors, video hall operators, regional associations, PGU", "cost_method": "Upgrade kits for 50 to 100 venues: UGX 1bn to 2.5bn.", "deps": ["G21"], "s": [3, 3, 2], "t_owner": 2, "p1": "5", "p2": "3", "region": "All regions outside Kampala", "label": "FACT", "sev": 2.67, "tr": 2.67, "prio": 7.13, "quad": "Monitor", "layers": [4], "stages": [6], "domain": "Infrastructure & equipment", "p1n": "5 Regional infrastructure", "p2n": "3 Regional festivals & associations", "costn": "Medium", "timen": "Medium", "dependents": []}, {"id": "G18", "d": 4, "title": "Four of seven regions have no hub in Phase I", "current": "Phase I hubs cover Kampala/Mulago, Mbarara and Gulu. The remaining regions are to be served by mobile teams, partner institutions and temporary centres (2027 programme, PROPOSAL). Karamoja has no film assets on record (D3).", "cur_label": "FACT", "target": "Every region has a named delivery point and equipment access by 2028.", "size": "4 regions (under D3's proposed scheme: Rest of Central, Eastern, West Nile, Karamoja) without fixed infrastructure.", "causes": "Phasing by budget; low recorded demand outside Kampala because demand is unmeasured.", "layer": "Layers 2 to 4", "players": "Regional producers, regional associations", "stage": "Production, exhibition", "affected": "Eastern, West Nile and Karamoja producers; regional-language storytellers.", "consequence": "Programme reads as Kampala-centred; regional legitimacy and NDP IV regional-balance case weaken.", "need": "Mobile production and screening units (Strategic Plan target: 5); named partner institution per region; regional allocation rule in the Fund.", "lead": "PGU Secretariat with MGLSD", "lead_type": "PGU Secretariat", "partners": "Regional associations, local governments, universities", "cost_method": "5 mobile units: UGX 0.75bn to 1.5bn (equipment and vehicle).", "deps": ["G35"], "s": [3, 3, 2], "t_owner": 3, "p1": "5", "p2": "3", "region": "Rest of Central, Eastern, West Nile, Karamoja", "label": "FACT", "sev": 2.67, "tr": 3.0, "prio": 8.01, "quad": "Monitor", "layers": [2, 3, 4], "stages": [2, 6], "domain": "Infrastructure & equipment", "p1n": "5 Regional infrastructure", "p2n": "3 Regional festivals & associations", "costn": "Medium", "timen": "Medium", "dependents": []}, {"id": "G19", "d": 5, "title": "Local films earn almost nothing from formal windows", "current": "Ugandan films screened under UCC Night grossed about UGX 43.5m before taxes over part of 2024; total local takings 'close to Shs60m' (Daily Monitor 2024). D3 estimates total cinema box office at UGX 5.4bn a year. Most Ugandan films exploit two or three windows (D2).", "cur_label": "FINDING", "target": "Local films earn from at least four licensed windows with reported revenue.", "size": "Local share of cinema box office about 1% (DERIVED: about UGX 0.06bn of UGX 5.4bn central).", "causes": "Few screens; no licence-fee market on TV; no sales capacity; no reporting; piracy.", "layer": "Layers 4 and 5", "players": "Distributors, cinemas, TV, OTT, ticketing", "stage": "Distribution, exhibition, monetisation", "affected": "Feature producers; investors.", "consequence": "No revenue history, so no finance (G08). This is the loop that keeps budgets micro.", "need": "Window-by-window market access programme: local content licensing (G20), video hall licensing (G21), platform terms (G22), export (G23).", "lead": "Lead ministry and UCC", "lead_type": "Agency", "partners": "PGU, platforms, broadcasters, exhibitors", "cost_method": "Sum of G20 to G23 measures.", "deps": ["G20", "G21", "G22"], "s": [5, 5, 4], "t_owner": 3, "p1": "7", "p2": "None", "region": "National", "label": "FINDING", "sev": 4.67, "tr": 3.0, "prio": 14.01, "quad": "Plan", "layers": [4, 5], "stages": [5, 6, 7], "domain": "Distribution, markets & monetisation", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "Medium", "timen": "Medium", "dependents": []}, {"id": "G20", "d": 5, "title": "Local content rules not translating into paid drama", "current": "Strategic Plan 2025 states UCC requires broadcasters to carry at least 70% local content with 40% from independent producers (primary rule text not sighted). Local drama was 2% of programming in January to March 2023 (NPA 2025 citing Caribou Digital). The two do not reconcile: local content counts news, talk and music.", "cur_label": "FINDING", "target": "Published quarterly compliance; a scripted local drama sub-quota with minimum licence fees.", "size": "Local drama share 2% (2023) against a 40% independent-production rule as stated.", "causes": "Quota defines 'local' broadly; no fee floor; weak monitoring and publication.", "layer": "Layer 4", "players": "FTA TV, pay-TV, producers", "stage": "Distribution", "affected": "Series producers; actors and crew on TV drama.", "consequence": "Broadcast airtime, the largest domestic audience, pays producers little.", "need": "UCC to publish compliance data and consult on a drama sub-quota and minimum licence-fee terms.", "lead": "UCC", "lead_type": "Agency", "partners": "MoICT&NG, broadcasters, PGU", "cost_method": "Monitoring and consultation within UCC budget: under UGX 200m.", "deps": ["G32"], "s": [4, 4, 3], "t_owner": 4, "p1": "7", "p2": "None", "region": "National", "label": "FINDING", "sev": 3.67, "tr": 4.67, "prio": 17.14, "quad": "Act now", "layers": [4], "stages": [5], "domain": "Distribution, markets & monetisation", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": ["G10", "G19"]}, {"id": "G21", "d": 5, "title": "Video hall economy unlicensed", "current": "About 1,000 video halls on a registered list (Twaweza); up to about 3,000 (The Conversation 2025); 15,000 in the Strategic Plan is unsourced. D3 estimates video halls take UGX 15bn a year from film, about 90% from foreign titles shown without licence (ESTIMATE).", "cur_label": "FINDING", "target": "Licensed video halls showing licensed content with a simple tariff paid to rights holders.", "size": "UGX 13.4bn a year of video hall value on unlicensed foreign titles (D3 ESTIMATE, range 0.7 to 110.9).", "causes": "Licensing split between local governments and UCC; no blanket licence product; enforcement capacity low.", "layer": "Layer 4", "players": "Video halls (bibanda), VJs, informal distributors", "stage": "Exhibition, royalties", "affected": "Video hall operators (mostly youth); local producers; rural audiences.", "consequence": "The largest exhibition channel pays nothing to Ugandan rights holders or the tax base.", "need": "Census (D3 item 6); blanket licence with a per-hall tariff via the audiovisual CMO; licensed local catalogue offer; formalisation rather than closure.", "lead": "Local governments and MoLG; UCC; URSB (CMO supervision)", "lead_type": "Local government", "partners": "UFMI, PGU, video hall associations", "cost_method": "Census UGX 150m to 250m (D3) plus licensing system.", "deps": ["G26", "G32"], "s": [4, 5, 3], "t_owner": 2, "p1": "None", "p2": "3", "region": "All regions", "label": "FINDING", "sev": 4.0, "tr": 2.67, "prio": 10.68, "quad": "Plan", "layers": [4], "stages": [6, 8], "domain": "Distribution, markets & monetisation", "p1n": "None", "p2n": "3 Regional festivals & associations", "costn": "Medium", "timen": "Medium", "dependents": ["G17", "G19"]}, {"id": "G22", "d": 5, "title": "Opaque platform terms and no reporting standard", "current": "Eight local OTT/VOD platforms named in PGU engagements; no revenue data (D3). YouTube pays creators 55% of watch-page advertising (Google). Platform reporting to producers: DATA GAP.", "cur_label": "DATA GAP", "target": "Model licence with minimum reporting, audit rights and term limits; UCC data returns.", "size": "Share of platform deals with written reporting obligations: DATA GAP.", "causes": "Small platforms; producers accept terms without advice; no standard.", "layer": "Layers 4 and 5", "players": "OTT and VOD, mobile and telco, producers", "stage": "Distribution, monetisation", "affected": "Producers licensing catalogues; investors needing revenue evidence.", "consequence": "Revenue cannot be verified, so it cannot support lending.", "need": "PGU model licence and reporting schedule; UCC to request platform data through licence returns (D3 item 7).", "lead": "PGU Secretariat (model licence); UCC (data)", "lead_type": "PGU Secretariat", "partners": "Platforms, URSB, lawyers", "cost_method": "Legal drafting and consultation: under UGX 50m.", "deps": ["G25"], "s": [3, 4, 3], "t_owner": 4, "p1": "7", "p2": "None", "region": "National", "label": "DATA GAP", "sev": 3.33, "tr": 4.67, "prio": 15.55, "quad": "Quick win", "layers": [4, 5], "stages": [5, 7], "domain": "Distribution, markets & monetisation", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": ["G19"]}, {"id": "G23", "d": 5, "title": "No export or diaspora sales system", "current": "UBOS records no cultural or recreational services exports for 2017 to 2019 (ITS 2020). Diaspora and export revenue: DATA GAP. PGU Strategic Plan figure of US$514.3m creative exports is a misread of total services exports (D3).", "cur_label": "FACT", "target": "Measured film exports; Ugandan titles represented at African and international markets each year.", "size": "Recorded exports: zero; true value DATA GAP.", "causes": "No sales agents; no market-attendance support; no export statistics line.", "layer": "Layers 4 and 5", "players": "Sales agents, festivals and markets, diaspora platforms", "stage": "Distribution, monetisation", "affected": "Producers with festival-grade titles; diaspora audiences.", "consequence": "Hard-currency licence income and cultural diplomacy value unrealised.", "need": "Market-attendance fund; export statistics line with UBOS and BoU; diaspora distribution partnerships.", "lead": "Commission (when formed); MoFA; UEPB", "lead_type": "Ministry", "partners": "UBOS, BoU, PGU, embassies", "cost_method": "Market stands and delegations: UGX 300m to 600m a year.", "deps": ["G02", "G25"], "s": [3, 3, 2], "t_owner": 2, "p1": "7", "p2": "None", "region": "National", "label": "FACT", "sev": 2.67, "tr": 3.33, "prio": 8.89, "quad": "Monitor", "layers": [4, 5], "stages": [5, 7], "domain": "Distribution, markets & monetisation", "p1n": "7 Investment, partnerships & exports", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": []}, {"id": "G24", "d": 5, "title": "Marketing and P&A unbudgeted", "current": "D2 hypothesis: marketing often unbudgeted, advertising spend goes to foreign platforms. D3 records marketing spend as a DATA GAP inside budgets.", "cur_label": "HYPOTHESIS", "target": "P&A of at least a defined share of budget for Fund-supported titles.", "size": "Marketing share of budgets: DATA GAP (production budget sample, D3 item 3).", "causes": "Micro budgets spent on the shoot; distribution not planned at development.", "layer": "Layer 5", "players": "Marketing and publicity, influencers, producers", "stage": "Marketing", "affected": "All feature producers.", "consequence": "Released films reach small audiences; weak box office repeats.", "need": "P&A window in the Fund; release-planning module in training.", "lead": "Fund manager", "lead_type": "Agency", "partners": "PGU, marketers", "cost_method": "Window inside Fund capital.", "deps": ["G07"], "s": [2, 3, 1], "t_owner": 3, "p1": "4", "p2": "None", "region": "National", "label": "HYPOTHESIS", "sev": 2.0, "tr": 3.67, "prio": 7.34, "quad": "Quick win", "layers": [5], "stages": [4], "domain": "Distribution, markets & monetisation", "p1n": "4 Film Fund", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": []}, {"id": "G25", "d": 6, "title": "Weak chain of title, now a legal risk under Act 8 of 2026", "current": "Copyright and Neighbouring Rights (Amendment) Act 2026 (Act 8; assent 29 April 2026; commenced 22 May 2026): assignments and licences must be written and registered within 60 days or are voidable (s.13(8)); assignments revert after 20 years unless the contract states otherwise (s.13A); 'performance' is defined as a live performance (s.1(a)) although the Beijing Treaty is given force of law (s.80A, Schedule 3). Producer practice on written contracts: DATA GAP.", "cur_label": "FACT", "target": "Every Fund-supported or financed title holds a registered, complete chain-of-title file.", "size": "Share of titles with complete registered chain of title: DATA GAP. Practitioner view: low.", "causes": "Oral deals; no standard contracts; registration cost and awareness; new registration and reversion rules not yet understood by producers or lenders.", "layer": "Layers 1, 2 and 6", "players": "Writers, producers, performers, composers, crew, entertainment lawyers, copyright office", "stage": "Development to royalties", "affected": "All rights holders. Performers and writers gain protection; producers carry the compliance burden.", "consequence": "Unregistered contracts are voidable, so titles become unfinanceable and unsaleable. A 20-year default reversion may cap catalogue value. Requires legal opinion.", "need": "Standard contract suite aligned to Act 8; registration drive with URSB; legal opinion on s.13A for audiovisual works; regulations to clarify audiovisual performers and producer rights.", "lead": "URSB and MoJCA (regulations); PGU Secretariat (contracts)", "lead_type": "Agency", "partners": "Uganda Law Society, entertainment lawyers, UFMI, PGU members", "cost_method": "Drafting, opinion and registration clinics: UGX 100m to 250m.", "deps": [], "s": [5, 5, 5], "t_owner": 4, "p1": "None", "p2": "None", "region": "National", "label": "FACT", "sev": 5.0, "tr": 4.67, "prio": 23.35, "quad": "Act now", "layers": [1, 2, 6], "stages": [1, 2, 3, 4, 5, 6, 7, 8], "domain": "IP, rights & contracts", "p1n": "None", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": ["G07", "G08", "G22", "G23", "G26", "G27", "G39"]}, {"id": "G26", "d": 6, "title": "Audiovisual collective management not delivering income", "current": "URSB names the Uganda Federation of Movie Industry (UFMI) as the audiovisual CMO (Sept 2025). UCC ordered broadcasters to secure copyright licences, naming UFMI (Sept 2025). D3 records audiovisual royalties at zero and 'no audiovisual CMO identified'. CONFLICT: entity exists; collections not evidenced. Act 8 allows one society per bundle of rights (s.56(3)) and requires AGMs (s.67A). Equitable remuneration for audiovisual fixations covers only commercial-advertisement use (s.9).", "cur_label": "FACT", "target": "A registered audiovisual CMO collecting from broadcasters, platforms and video halls, publishing distributions.", "size": "Audiovisual royalty collections: DATA GAP (D3 shows zero identified).", "causes": "Narrow remuneration right; no tariffs; weak data; governance capacity.", "layer": "Layer 6", "players": "Copyright office and CMOs, broadcasters, producers, performers", "stage": "Royalties", "affected": "Producers, performers, writers; especially older catalogue holders.", "consequence": "Secondary income absent; video hall and broadcast licensing (G21) has no collecting channel.", "need": "Verify UFMI registration and mandate under new s.56; publish tariffs; governance and distribution audit; consider broader remuneration right in regulations.", "lead": "URSB", "lead_type": "Agency", "partners": "UFMI, UCC, PGU, MoJCA", "cost_method": "Audit and tariff setting: under UGX 200m.", "deps": ["G25"], "s": [4, 4, 4], "t_owner": 3, "p1": "None", "p2": "None", "region": "National", "label": "FACT", "sev": 4.0, "tr": 3.67, "prio": 14.68, "quad": "Act now", "layers": [6], "stages": [8], "domain": "IP, rights & contracts", "p1n": "None", "p2n": "None", "costn": "Low", "timen": "Medium", "dependents": ["G21"]}, {"id": "G27", "d": 6, "title": "Piracy and enforcement depend on registration", "current": "Act 8 adds notice-and-takedown (s.49A) but the Registrar acts only where the owner holds a registration certificate; penalties rise to 2,500 currency points or 10 years (s.15, s.16). UCC and URSB committed to a joint public notice against unlicensed content (PGU Impact Report). Piracy losses: DATA GAP.", "cur_label": "FACT", "target": "Registered titles; working takedown protocol with platforms and ISPs.", "size": "Registered film titles at URSB: DATA GAP.", "causes": "Low registration; enforcement capacity; informal distribution networks.", "layer": "Layers 4 and 6", "players": "Copyright office, UCC, platforms, video halls", "stage": "Exhibition, monetisation", "affected": "Producers of popular titles; platforms.", "consequence": "New legal tools unusable by unregistered owners.", "need": "Bulk registration for members; takedown protocol; anti-piracy reporting desk.", "lead": "URSB", "lead_type": "Agency", "partners": "UCC, Uganda Police, PGU, platforms", "cost_method": "Registration clinics and protocol: under UGX 150m.", "deps": ["G25"], "s": [3, 4, 3], "t_owner": 4, "p1": "None", "p2": "None", "region": "National", "label": "FACT", "sev": 3.33, "tr": 4.67, "prio": 15.55, "quad": "Quick win", "layers": [4, 6], "stages": [6, 7], "domain": "IP, rights & contracts", "p1n": "None", "p2n": "None", "costn": "Low", "timen": "Quick win", "dependents": []}, {"id": "G28", "d": 6, "title": "No national film title register or identifiers", "current": "No register of completed titles (D3: films per year unknown, 150 to 300 features ESTIMATE). Media Council classification and URSB registration are not linked. Use of ISAN or equivalent: DATA GAP.", "c function loopSvg(){
  const nodes = ["Micro budgets","Quality below buyer standard","Little licence income","No revenue history","No finance"];
  const cx=260, cy=180, r=125, pts = nodes.map((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/5; return [cx+r*Math.cos(a), cy+r*Math.sin(a)];});
  const trim=(a,b,d)=>{const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy); return [a[0]+dx/L*d, a[1]+dy/L*d];};
  const arcs = pts.map((p,i)=>{const q=pts[(i+1)%5]; const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; const k=1.22; const c=[cx+(mx-cx)*k, cy+(my-cy)*k]; const s=trim(p,c,i===2?66:44), e=trim(q,c,i===1?40:44); return `<path d="M${s[0].toFixed(1)},${s[1].toFixed(1)} Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${e[0].toFixed(1)},${e[1].toFixed(1)}" fill="none" stroke="var(--gold)" stroke-width="2" marker-end="url(#ah)" stroke-dasharray="${i===2?'5 4':'0'}"/>`;}).join('');
  const lab = (t,x,y)=>{const words=t.split(' '); const lines=[]; let cur=''; words.forEach(w=>{ if((cur+' '+w).trim().length>14){lines.push(cur.trim()); cur=w;} else cur+=' '+w;}); lines.push(cur.trim()); return `<g><rect x="${x-62}" y="${y-10-lines.length*8}" width="124" height="${lines.length*16+12}" rx="6" fill="var(--surface)" stroke="var(--line)"/>${lines.map((l,j)=>`<text x="${x}" y="${y-lines.length*8+8+j*16}" text-anchor="middle" font-size="12.5" font-weight="600">${esc(l)}</text>`).join('')}</g>`;};
  const brk = (()=>{const p=pts[2], q=pts[3]; const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2; const bx=cx+(mx-cx)*1.42, by=cy+(my-cy)*1.42; return `<g><rect x="${bx-78}" y="${by-18}" width="156" height="36" rx="18" fill="var(--gold-soft)" stroke="var(--gold)"/><text x="${bx}" y="${by-2}" text-anchor="middle" font-size="11" font-weight="700">Break point: signed,</text><text x="${bx}" y="${by+11}" text-anchor="middle" font-size="11" font-weight="700">registered licence</text></g>`;})();
  return `<svg viewBox="0 0 520 380" role="img" aria-label="Loop: micro budgets lead to quality below buyer standard, little licence income, no revenue history, no finance, and back to micro budgets. Break point: a signed, registered licence."><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--gold)"/></marker></defs>${arcs}${pts.map((p,i)=>lab(nodes[i],p[0],p[1])).join('')}${brk}</svg>`;
}

function filtered(){
  const q = F.q.trim().toLowerCase();
  let r = GAPS.filter(g =>
    (!F.domain || String(g.d)===F.domain) && (!F.quad || g.quad===F.quad) &&
    (!F.pillar || g.p1n===F.pillar || g.p2n===F.pillar) && (!F.lead || g.lead_type===F.lead) &&
    (!F.ev || g.label===F.ev) && (!F.region || g.region===F.region) &&
    (!F.layer || g.layers.includes(+F.layer)) && (F.stage==='' || g.stages.includes(+F.stage)) &&
    (!q || [g.id,g.title,g.current,g.need,g.lead,g.partners,g.causes].join(' ').toLowerCase().includes(q)));
  const s = {prio:(a,b)=>b.prio-a.prio, sev:(a,b)=>b.sev-a.sev, tr:(a,b)=>b.tr-a.tr, id:(a,b)=>a.id.localeCompare(b.id)}[F.sort];
  return r.sort(s);
}
