    <text class="axis" x="${m.l+iw/2}" y="${H-10}" text-anchor="middle">TRACTABILITY: EASIER TO CLOSE →</text>
    <text class="axis" transform="translate(16 ${m.t+ih/2}) rotate(-90)" text-anchor="middle">SEVERITY: MORE DAMAGING →</text>
    ${pos.map(p=>`<g class="dot" tabindex="0" role="button" data-gap="${p.g.id}" aria-label="${p.g.id} ${esc(p.g.title)}, severity ${p.g.sev}, tractability ${p.g.tr}"><title>${p.g.id} ${esc(p.g.title)}</title><circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="${D.top.includes(p.g.id)?9:7}" fill="${qcol[p.g.quad]}"/><text x="${(p.cx+11).toFixed(1)}" y="${(p.cy+3.5).toFixed(1)}">${p.g.id.slice(1)}</text></g>`).join('')}
  </svg>`;
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Prioritisation matrix</span><h2>Severity against tractability</h2><p class="muted" style="max-width:72ch">Each gap is scored 1 to 5 on breadth, consequence and blocking effect (severity) and on cost, ownership readiness and time (tractability). The threshold is 3.5 on both axes. Larger dots are Top 10 needs. Select a dot for its card.</p></div>
    <div class="panel matrix">${svg}</div>
    <div class="qlists">${QORDER.map(q=>{const L=GAPS.filter(g=>g.quad===q).sort((a,b)=>b.prio-a.prio); return `<div class="panel qlist stack"><h3>${qchip(q)} <span>${L.length} gaps</span></h3><p class="muted" style="font-size:.88rem">${QDESC[q]}</p><div>${L.map(g=>`<button class="linkrow" data-gap="${g.id}"><span class="gid">${g.id}</span><span>${esc(g.title)}</span><span class="pr">${g.prio.toFixed(1)}</span></button>`).join('')}</div></div>`;}).join('')}</div>
  </section>`;
}

function vTop(){
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Top 10 priority needs</span><h2>What to do first, and who leads</h2><p class="muted" style="max-width:72ch">Ranked by severity × tractability among sector gaps with severity of 3.5 or more. Nine of the ten cost under UGX 500m and use powers institutions already hold.</p></div>
    <div class="topgrid">${D.top.map((id,i)=>{const g=BY[id]; return `<article class="topcard"><span class="rk">${i+1}</span><div class="stack"><span class="gid">${g.id} · ${esc(g.domain)}</span><h3>${esc(g.title)}</h3><p>${esc(CASE[id])}</p><div class="kvs"><span>Lead <b>${esc(g.lead)}</b></span><span>Cost <b>${esc(g.costn)}</b></span><span>Time <b>${esc(g.timen)}</b></span></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${qchip(g.quad)}${evchip(g.label)}<button class="textlink" data-gap="${g.id}">Full gap card</button></div></div></article>`;}).join('')}</div>
    <div class="panel stack"><span class="eyebrow">Plan now, deliver later</span><h3>Three structural commitments</h3>
      <div class="grid3">
        <div class="stack"><b>National Film Fund</b><p class="muted">UGX 33.15bn proposed. Not ready to disburse at scale in 2027: no legal vehicle, manager or appraisal data. A design year with a small development-grant pilot through an independent manager is defensible.</p><button class="textlink" data-gap="G07">G07</button></div>
        <div class="stack"><b>Film commission</b><p class="muted">One front door for producers, investors and foreign productions, separating development from content regulation. Follows the policy.</p><button class="textlink" data-gap="G02">G02</button></div>
        <div class="stack"><b>Phase I regional hubs</b><p class="muted">Kampala/Mulago, Mbarara and Gulu, with mobile units for the other regions. Business cases first, construction second.</p><button class="textlink" data-gap="G15">G15</button></div>
      </div>
      <p class="callout">A production incentive should follow the commission and a single permit window, funded from a ring-fenced annual allocation before it is announced. South Africa's rebate approved no new projects in 2024/25 and 2025/26 for lack of funds.</p>
    </div>
  </section>`;
}

let depSel = 'G25';
function vRoadmap(){
  const g = BY[depSel];
  const pillarRows = Object.entries(D.pillars).filter(([k])=>k!=='None').map(([k,n])=>[n, GAPS.filter(x=>x.p1n===n).map(x=>x.id), GAPS.filter(x=>x.p2n===n).map(x=>x.id)]);
  const unc = GAPS.filter(x=>x.p1n==='None');
  const pill = (id, cls='') => `<button class="pill ${cls}" data-gap="${id}" title="${esc(BY[id]?.title)}">${id}</button>`;
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Sequencing</span><h2>Order follows dependencies</h2><p class="muted" style="max-width:72ch">A need that others depend on comes first, even when it is less visible. Gaps not named in the report's sequencing table are placed by their dependencies.</p></div>
    <div class="phases">${PHASES.map((p,i)=>`<div class="phase"><span class="when">Phase ${i} · ${esc(p.when)}</span><h3>${esc(p.name)}</h3><p class="why">${esc(p.why)}</p><div class="pills">${p.ids.map(id=>pill(id)).join('')}</div></div>`).join('')}</div>

    <div class="panel stack">
      <div class="toolbar"><div class="stack" style="gap:4px"><span class="eyebrow">Dependency explorer</span><h3>What must come first, and what it unlocks</h3></div>
      <label for="dep-sel" class="eyebrow" style="display:flex;gap:8px;align-items:center">Gap <select id="dep-sel" class="btn">${GAPS.map(x=>`<option value="${x.id}" ${x.id===depSel?'selected':''}>${x.id} ${esc(x.title)}</option>`).join('')}</select></label></div>
      <div class="depx">
        <div class="stack"><span class="eyebrow">Needs first</span><div class="pills">${g.deps.length?g.deps.map(id=>pill(id)).join(''):'<span class="muted">Nothing. It can start now.</span>'}</div>${g.deps.map(id=>`<span class="muted" style="font-size:.84rem">${id} ${esc(BY[id]?.title)}</span>`).join('')}</div>
        <div class="centre stack"><span class="gid">${g.id}</span><b>${esc(g.title)}</b><span style="font-size:.9rem">${esc(g.need)}</span><button class="textlink" data-gap="${g.id}">Full gap card</button></div>
        <div class="stack"><span class="eyebrow">Unlocks</span><div class="pills">${g.dependents.length?g.dependents.map(id=>pill(id)).join(''):'<span class="muted">No other gap depends on it.</span>'}</div>${g.dependents.map(id=>`<span class="muted" style="font-size:.84rem">${id} ${esc(BY[id]?.title)}</span>`).join('')}</div>
      </div>
    </div>

    <div class="grid2">
      <div class="panel stack"><span class="eyebrow">Gap-to-pillar map</span><h3>NFIDP 2026-2029 pillars</h3>
        <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Pillar</th><th>Primary</th><th>Secondary</th></tr></thead><tbody>${pillarRows.map(([n,p,s])=>`<tr><td>${esc(n)}</td><td><div class="pills">${p.map(id=>pill(id)).join('')||'-'}</div></td><td><div class="pills">${s.map(id=>pill(id,'dep')).join('')||'-'}</div></td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="panel stack"><span class="eyebrow">Not covered by any pillar</span><h3>${unc.length} gaps with no primary pillar</h3>
        <div>${unc.map(x=>`<button class="linkrow" data-gap="${x.id}"><span class="gid">${x.id}</span><span>${esc(x.title)}</span><span class="pr">${esc(x.domain.split(',')[0])}</span></button>`).join('')}</div>
        <p class="callout">The programme has no pillar for rights and contracts, labour and welfare, or archives. Rights are the root cause of the finance gap. Domestic distribution sits under the investment and exports pillar only by default. The assessment recommends an added component, "Rights, markets and decent work", with its own budget line.</p>
      </div>
    </div>
  </section>`;
}
function bindRoadmap(){ $('#dep-sel')?.addEventListener('change', e=>{ depSel=e.target.value; render(); $('#dep-sel')?.focus(); }); }

function vMethod(){
  return `<section class="view">
    <div class="stack"><span class="eyebrow">Evidence &amp; method</span><h2>How to read this assessment</h2><p class="muted" style="max-width:72ch">Every statement carries one evidence label. Figures the assessment could not trace to a primary source are not used. Conflicts between sources are listed, not reconciled.</p></div>
    <div class="grid2">
      <div class="panel stack"><h3>Evidence labels</h3>
        <div class="stack">
          <div>${evchip('FACT')} <span>Stated in a cited source.</span></div>
          <div>${evchip('FINDING')} <span>An inference from cited data, reasoning shown.</span></div>
          <div>${evchip('HYPOTHESIS')} <span>Practitioner view from industry experience, to be validated.</span></div>
          <div>${evchip('DATA GAP')} <span>No data exists; the collection method is stated.</span></div>
          <p class="muted" style="font-size:.88rem">ESTIMATE marks figures from the Economic &amp; Employment Baseline model, which carries low, central and high cases. PROPOSAL marks programme targets, which are not achievements.</p>
        </div>
      </div>
      <div class="panel stack"><h3>Scoring rubric</h3>
        <div class="tablewrap"><table style="min-width:0"><thead><tr><th>Sub-score</th><th>1</th><th>5</th></tr></thead><tbody>
          <tr><td><b>S1 Breadth</b></td><td>One player category</td><td>Three or more value-chain layers</td></tr>
          <tr><td><b>S2 Consequence</b></td><td>Minor inefficiency</td><td>Blocks sector growth or causes serious harm</td></tr>
          <tr><td><b>S3 Blocking</b></td><td>Nothing depends on it</td><td>Four or more gaps depend on it, or a legal precondition</td></tr>
          <tr><td><b>T1 Cost</b></td><td>Over UGX 5bn</td><td>Under UGX 500m</td></tr>
          <tr><td><b>T2 Ownership</b></td><td>No institution holds the mandate</td><td>One clear owner able to act now</td></tr>
          <tr><td><b>T3 Time</b></td><td>3+ years</td><td>Under 12 months</td></tr>
        </tbody></table></div>
        <p class="muted" style="font-size:.88rem">Severity and tractability are each the average of their sub-scores; priority is their product (maximum 25). Scores will be revised after stakeholder validation.</p>
      </div>
    </div>
    <div class="panel stack"><h3>Regional benchmarks</h3><p class="muted" style="font-size:.88rem">Shown only where a source was found. "Not verified" cells were not filled from general knowledge.</p>
      <div class="tablewrap"><table><thead><tr><th>Country</th><th>Film body</th><th>Production incentive</th><th>Public finance</th><th>Note</th><th>Source</th></tr></thead><tbody>${BENCH.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<b>${esc(c)}</b>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    </div>
    <div class="panel stack"><h3>Source conflicts</h3>
      <div class="tablewrap"><table><thead><tr><th>Item</th><th>Source A</th><th>Source B</th><th>Treatment</th></tr></thead><tbody>${CONFLICTS.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<b>${esc(c)}</b>`:esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    </div>
    <div class="grid2">
      <div class="panel stack"><h3>Validation programme</h3><p>Hypotheses are being tested before the findings are finalised:</p>
        <ul style="margin:0;padding-left:1.1em;display:grid;gap:4px"><li>40 key informant interviews across Government, financiers, broadcasters and platforms, exhibitors and training institutions</li><li>14 focus groups: producers, and crew and performers, in each of seven regions</li><li>An online practitioner survey of 20 questions</li><li>A one-day validation workshop to re-score the gaps and agree owners</li></ul>
      </div>
      <div class="panel stack"><h3>What this builds on</h3><p>The Film Industry Value Chain Map (Deliverable 2: six layers, 54 player categories, nine money-flow stages) and the Economic &amp; Employment Baseline (Deliverable 3, cited as D3), both part of the National Film Sector Mapping, Diagnostic and Development Framework.</p><p class="muted" style="font-size:.88rem">Statements on the Copyright and Neighbouring Rights (Amendment) Act 2026 summarise the Act text and are not legal advice.</p></div>
    </div>
    <div class="panel stack"><h3>Sources</h3><ol class="sources" style="margin:0;padding-left:1.3em">${SOURCES.map(([t,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ol>
      <p class="muted" style="font-size:.85rem">Further official sources (UBOS national accounts and labour surveys, tax data) are cited in the Economic &amp; Employment Baseline.</p></div>
  </section>`;
}

/* ---------- drawer ---------- */
let lastFocus = null;
function openGap(id){
  const g = BY[id]; if(!g) return;
  lastFocus = document.activeElement;
  const dl = [
    ['Current state', `${esc(g.current)} ${evchip(g.cur_label)}`],
    ['Target state', esc(g.target)], ['Gap and measure', esc(g.size)], ['Root causes', esc(g.causes)],
    ['Value chain', `Layer: ${esc(g.layer)}<br>Players: ${esc(g.players)}<br>Stage: ${esc(g.stage)}`],
    ['Who is affected', esc(g.affected)], ['If unaddressed', esc(g.consequence)],
    ['Need', `<b>${esc(g.need)}</b>`], ['Lead', `${esc(g.lead)} <span class="muted">(${esc(g.lead_type)})</span>`], ['Partners', esc(g.partners)],
    ['Cost', `${esc(g.costn)}. ${esc(g.cost_method)}`], ['Time to effect', esc(g.timen)],
    ['Needs first', g.deps.length ? `<div class="pills">${g.deps.map(d=>`<button class="pill" data-gap="${d}">${d}</button>`).join('')}</div>` : 'Nothing'],
    ['Unlocks', g.dependents.length ? `<div class="pills">${g.dependents.map(d=>`<button class="pill" data-gap="${d}">${d}</button>`).join('')}</div>` : 'No other gap'],
    ['NFIDP pillar', esc(g.p1n === 'None' ? 'No pillar covers it' : g.p1n) + (g.p2n!=='None' ? `; secondary ${esc(g.p2n)}` : '')],
    ['Region', esc(g.region)]
  ];
  const dr = document.getElementById('drawer');
  dr.innerHTML = `<div class="dhead"><button class="btn x" id="d-close" type="button">Close</button><span class="gid">${g.id} · ${esc(g.domain)}</span><h2 id="d-title" style="font-size:1.7rem">${esc(g.title)}</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${qchip(g.quad)}${evchip(g.label)}${D.top.includes(g.id)?`<span class="chip" style="background:var(--gold-soft);color:var(--ink)">Top 10 · #${D.top.indexOf(g.id)+1}</span>`:''}</div></div>
  <div class="dbody"><div class="scoregrid"><div><b>${g.sev.toFixed(2)}</b>Severity<br><span class="mono">S ${g.s.join(' / ')}</span></div><div><b>${g.tr.toFixed(2)}</b>Tractability</div><div><b>${g.prio.toFixed(1)}</b>Priority (of 25)</div></div><dl>${dl.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl></div>`;
  dr.hidden = false; document.getElementById('scrim').hidden = false;
  document.getElementById('d-close').addEventListener('click', closeGap);
  document.getElementById('d-close').focus();
}
function closeGap(){ document.getElementById('drawer').hidden = true; document.getElementById('scrim').hidden = true; if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
document.getElementById('scrim').addEventListener('click', closeGap);
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !document.getElementById('drawer').hidden) closeGap(); if((e.key==='Enter'||e.key===' ') && e.target.classList?.contains('dot')){ e.preventDefault(); openGap(e.target.dataset.gap); } });
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-gap],[data-stage],[data-layer],[data-quad]'); if(!t) return;
  if(t.dataset.gap){ openGap(t.dataset.gap); return; }
  if(t.dataset.stage) setFilter({stage:t.dataset.stage, layer:'', quad:''});
  else if(t.dataset.layer) setFilter({layer:t.dataset.layer, stage:'', quad:''});
  else if(t.dataset.quad) setFilter({quad:t.dataset.quad, layer:'', stage:''});
});

/* ---------- router ---------- */
const VIEWS = {overview:vOverview, gaps:vGaps, matrix:vMatrix, priorities:vTop, roadmap:vRoadmap, method:vMethod};
function current(){ const h = location.hash.slice(1); return VIEWS[h] ? h : 'overview'; }
function render(){
  const v = current();
  document.getElementById('main').innerHTML = VIEWS[v]();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href')==='#'+v ? 'page' : 'false'));
  if(v==='gaps') bindGaps(); if(v==='roadmap') bindRoadmap();
}
window.addEventListener('hashchange', ()=>{ render(); window.scrollTo(0,0); });
document.getElementById('foot').innerHTML = `<div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap"><span>National Producers Guild of Uganda · Uganda National Film Sector Mapping, Diagnostic and Development Framework · Deliverable 5 of 7</span><span><a href="/">Economic &amp; Employment Baseline (D3)</a> · ${esc(STATUS.tag)} · November 2026</span></div>`;
render();
})();
</script>

</body>
</html>
